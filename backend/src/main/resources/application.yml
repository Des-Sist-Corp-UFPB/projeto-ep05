spring:
  application:
    name: mercado
  profiles:
    active: dev

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    mcp:
      server:
          name: pedidos-mcp
          version: 0.0.1
    openai:
      base-url: https://llm.rodrigor.com
      api-key: ${LLM_API_KEY:sk-nao-configurada}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
          temperature: 0.3

app:
  mail:
    from: ${MAIL_FROM:no-reply@delightssweet.com}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}

# Actuator - monitoramento da aplicação
# Acesse: http://localhost:8080/actuator/health
management:
  endpoints:
    web:
      exposure:
        # Expõe apenas os endpoints necessários (não exponha todos em produção!)
        include: health,info,metrics
  endpoint:
    health:
      # Detalhes do health só são exibidos para usuários autenticados
      show-details: when-authorized
